<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuestionario de Gustos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-100 to-indigo-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white/80 backdrop-blur-md rounded-2xl shadow-xl p-8 max-w-md w-full border border-white/50 text-center relative overflow-hidden">
    
    <!-- Pantalla de Inicio -->
    <div id="pantalla-inicio" class="space-y-6">
      <h1 class="text-3xl font-bold text-gray-800">✨ Cuestionario ✨</h1>
      <p class="text-gray-600 text-sm">Responde estas sencillas preguntas para conocerte un poco mejor. 💕</p>
      <div class="text-left">
        <label class="block text-sm font-medium text-gray-700 mb-1">Tu nombre:</label>
        <input type="text" id="nombre-usuario" placeholder="Escribe tu nombre..." class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-pink-400 focus:outline-none text-gray-800">
      </div>
      <button onclick="empezarQuiz()" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-3 rounded-xl shadow-lg transition transform active:scale-95">
        Comenzar ✨
      </button>
    </div>

    <!-- Contenedor del Cuestionario -->
    <div id="quiz-container" class="hidden space-y-6">
      <div class="w-full bg-gray-200 rounded-full h-2.5">
        <div id="barra-progreso" class="bg-pink-500 h-2.5 rounded-full transition-all duration-300" style="width: 10%"></div>
      </div>

      <div id="pregunta-box">
        <h2 id="pregunta-titulo" class="text-xl font-semibold text-gray-800 mb-4"></h2>
        <div id="opciones-container" class="space-y-3"></div>
      </div>
    </div>

    <!-- Pantalla Final -->
    <div id="pantalla-final" class="hidden space-y-4">
      <div class="text-5xl animate-bounce">🎉</div>
      <h2 id="mensaje-final-titulo" class="text-2xl font-bold text-gray-800"></h2>
      <p id="mensaje-final-texto" class="text-gray-600 text-sm"></p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
